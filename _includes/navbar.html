<nav class="navbar is-white is-fixed-top has-text-black	" role="navigation" aria-label="main navigation" id="navbar">
    <div class="container">

        <!-- logo or branding on left side -->
        <div class="navbar-brand">
            <a class="navbar-item nav-brand-text"
                href="{% if page.layout == 'default' %}{{ site.url }}{{ site.baseurl }}/#{% else %}{{ site.url }}{{ site.baseurl }}/{% endif %}">
                QANT Labs
            </a>
            <button class="navbar-burger" type="button" data-target="navbar-menu" aria-label="Open navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- children of navbar-menu must be navbar-start and/or navbar-end -->
        <div class="navbar-menu has-background-white has-text-black" id="navbar-menu">
            <!-- navbar items | left side -->
            <!-- <div class="navbar-start">
            </div> -->
            <!-- navbar items | right side -->
            <div class="navbar-end">
                <a class="navbar-item" data-section-target="hero"
                    href="{% if page.layout == 'default' %}{{site.url}}{{site.baseurl}}/#{% else %}{{site.url}}{{site.baseurl}}/{% endif %}">HOME</a>
                <a class="navbar-item" data-section-target="about" href="{{site.url}}{{site.baseurl}}/#about">ABOUT US</a>
                <a class="navbar-item" data-section-target="research" href="{{site.url}}{{site.baseurl}}/#research">RESEARCH</a>
                <!-- <a class="navbar-item" href="{{site.url}}{{site.baseurl}}/#pubAndNews">PUBLICATIONS</a> -->
                <a class="navbar-item" data-section-target="contact" href="{{site.url}}{{site.baseurl}}/#contact">CONTACT</a>
                <!-- One entry for all three products rather than one per product:
                     the bar is already full, and the section it lands on links
                     each of them out. -->
                <a class="navbar-item navbar-item-product" data-section-target="products" href="{{site.url}}{{site.baseurl}}/#products">PRODUCTS</a>
                <a class="navbar-item {% if page.url contains '/gsoc' %}is-active{% endif %} navbar-item-highlight" href="{{site.url}}{{site.baseurl}}/gsoc">GSoC 2026</a>
                <!-- <a class="navbar-item {% if page.layout == 'blog' %}is-active{% endif %}"
                    href="{{site.url}}{{site.baseurl}}/blog">BLOG</a> -->
                <!-- <p> include dropdown.html "%}"</p> -->
            </div>

        </div>
    </div>
</nav>
<!-- Bulma Navbar JS -->
<script>
    function initNavbarMenu() {
        /* Get all "navbar-burger" elements */
        var $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);
        /* Check if there are any navbar burgers */
        if ($navbarBurgers.length > 0) {
            /* Add a click event on each of them */
            $navbarBurgers.forEach(function ($el) {
                var target = $el.dataset.target;
                var $target = document.getElementById(target);

                function setMenuOpen(isOpen) {
                    if (!$target) return;
                    $el.classList.toggle('is-active', isOpen);
                    $target.classList.toggle('is-active', isOpen);
                    $el.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                    $el.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
                    document.body.classList.toggle('has-mobile-menu-open', isOpen);
                }

                $el.addEventListener('click', function () {
                    /* Get the target from the "data-target" attribute */
                    if (!$target) return;
                    /* Toggle the class on both the "navbar-burger" and the "navbar-menu" */
                    var isOpen = !$target.classList.contains('is-active');
                    setMenuOpen(isOpen);
                });

                if ($target) {
                    Array.prototype.forEach.call($target.querySelectorAll('.navbar-item'), function ($link) {
                        $link.addEventListener('click', function () {
                            setMenuOpen(false);
                        });
                    });
                }
            });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initNavbarMenu);
    } else {
        initNavbarMenu();
    }
</script>
