<footer id="footer">
    <div class="container footer-inner">
        <div>
            <p class="footer-brand">QANT Labs</p>
            <p class="footer-copy">Quantum science, AI, cybersecurity, and privacy research for practical secure systems.</p>
        </div>
        <div class="footer-products">
            <p class="footer-products-title">Products</p>
            <ul>
                {% for product in site.data.products %}
                <li><a href="{{ product.url }}" target="_blank" rel="noopener">{{ product.name }}</a></li>
                {% endfor %}
            </ul>
        </div>
        <a class="footer-top" onclick="window.scroll(0,0)">Back to top</a>
    </div>
    <div id="credits">
        <i class="far fa-copyright"></i> {{ "now" | date: "%Y" }} | QANT Labs. All Rights Reserved.
    </div>
</footer>
