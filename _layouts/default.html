<script>
  var navItems = document.querySelectorAll('.navbar-item[data-section-target]');
  var navbar = document.getElementById('navbar');
  var hero = document.getElementById('hero');
  var sections = Array.prototype.map.call(navItems, function (item) {
    return {
      item: item,
      section: document.getElementById(item.getAttribute('data-section-target'))
    };
  }).filter(function (entry) {
    return entry.section;
  });
  const viewOffset = 200; 
  var navHeight = navbar ? navbar.offsetHeight : 72;

  function updateNavbarBackdrop() {
    if (!navbar || !hero) return;
    navbar.classList.toggle('is-scrolled', window.scrollY > hero.offsetHeight - navHeight);
  }

  updateNavbarBackdrop();

  window.addEventListener("scroll", function (event) {
    var scroll = this.scrollY;
    updateNavbarBackdrop();

    sections.forEach(function (entry) {
      entry.item.classList.remove('is-active');
    });

    sections.forEach(function (entry) {
        var sectionTop = entry.section.offsetTop - viewOffset;
        var sectionBottom = entry.section.offsetTop + entry.section.offsetHeight - viewOffset;

        if (scroll >= sectionTop && scroll < sectionBottom) {
          entry.item.classList.add('is-active');
      }
    });
    
  });
</script>
